<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>梦角传讯</title>
<link rel="icon" href="data:,">
<style>
:root{
  --glass-alpha:.55;
  --glass-blur:24px;
  --glass-bg:rgba(255,255,255,var(--glass-alpha));
  --glass-line:rgba(255,255,255,.78);
  --ink:#1c1c1e;
  --sub:#8e8e93;
  --blue:#0a84ff;
  --in-bg:#e9e9eb;
  --avatar-size:44px;
  --avatar-radius:50%;
  --bubble-font:15px;
  --bubble-pad:9px 14px;
  --msg-gap:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:-webkit-fill-available;height:100dvh;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#ffffff 0%,#efeff1 100%);
  -webkit-font-smoothing:antialiased;
}
#app{
  position:relative;z-index:1;max-width:460px;margin:0 auto;height:100vh;height:-webkit-fill-available;height:100dvh;max-height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  background:rgba(255,255,255,.44);
  border-left:1px solid rgba(255,255,255,.75);border-right:1px solid rgba(255,255,255,.75);
  box-shadow:0 0 60px rgba(60,70,85,.10);
}
@media(min-width:520px){#app{height:min(880px,96vh);margin-top:max(2vh,12px);border-radius:30px;border:1px solid rgba(255,255,255,.9)}}
/* 聊天背景只作用于聊天页，覆盖上下框 */
#chat-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;z-index:0;pointer-events:none}
.glass{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);border:1px solid var(--glass-line)}
#topbar{
  position:relative;z-index:5;height:auto;min-height:58px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:0 16px;padding-top:env(safe-area-inset-top,0px);
  background:rgba(255,255,255,.66);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(60,60,67,.05);
}
#topbar .tb-title{font-size:17px;font-weight:600;letter-spacing:.5px;color:#2b2b30}
.tb-btn{position:absolute;right:14px;top:29px;top:calc(env(safe-area-inset-top,0px) + 29px);transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.6);display:grid;place-items:center;color:#3a7bd5;cursor:pointer}
.tb-btn:active{transform:translateY(-50%) scale(.92)}
#views{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 14px 26px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.view.active{display:block}
.view::-webkit-scrollbar{width:0}
#tabbar{
  position:relative;z-index:5;flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-around;
  height:auto;min-height:62px;min-height:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(255,255,255,.68);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  border-top:1px solid rgba(255,255,255,.9);box-shadow:0 -1px 0 rgba(60,60,67,.05);
}
.tab{flex:1;height:62px;display:grid;place-items:center;color:#9aa2ae;cursor:pointer;transition:.2s;border:0;background:transparent}
.tab.active{color:var(--blue)}
.tab.active::after{content:"";position:absolute;bottom:9px;width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:.75}
.tab{position:relative}
.tab svg{transition:.2s}
.tab.active svg{transform:translateY(-2px) scale(1.06)}
#app.chat-open #topbar,#app.chat-open #tabbar,#app.chat-open #views{opacity:0;pointer-events:none}
/* ---------- 通用组件 ---------- */
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 8px 24px rgba(60,60,70,.08),inset 0 1px 0 rgba(255,255,255,.9)}
.sec{margin:14px 0 8px;font-size:12px;color:#8a8a8f;letter-spacing:1px;padding-left:6px}
.btn{border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.84);color:#2f6fd0;border-radius:14px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:#0a84ff;color:#fff;border-color:rgba(255,255,255,.6);box-shadow:0 6px 16px rgba(10,132,255,.20)}
.btn.danger{color:#e0536b}
.btn.ghost{color:#5c6472}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:11px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:12px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea,select{
  font-family:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.85);
  border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:9px 11px;outline:none;width:100%;
}
input:focus,textarea:focus,select:focus{border-color:rgba(10,132,255,.55);box-shadow:0 0 0 3px rgba(10,132,255,.10)}
input[type=range]{padding:0;height:26px;background:transparent;border:0;box-shadow:none;accent-color:var(--blue)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue);flex:0 0 auto}
input[type=number]{max-width:110px}
textarea{resize:vertical;line-height:1.55}
label.fld{display:block;font-size:12px;color:#7d8794;margin:10px 0 5px;padding-left:3px}
.divider{height:1px;background:rgba(60,60,67,.08);margin:10px 0}
.pill{padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);font-size:11px;color:#6d7684}
.empty{text-align:center;color:#9aa3b0;font-size:13px;padding:52px 20px;line-height:1.9}
.av{width:var(--avatar-size);height:var(--avatar-size);border-radius:var(--avatar-radius);object-fit:cover;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:600;font-size:calc(var(--avatar-size)*.38);background:linear-gradient(135deg,#ececef,#d6d6db);color:#8a8a90;overflow:hidden;border:1px solid rgba(255,255,255,.85)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:34px;height:34px;font-size:13px}
.av.lg{width:72px;height:72px;font-size:26px}
/* ---------- 会话列表（微信式） ---------- */
.chat-item{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(16px);box-shadow:0 4px 16px rgba(60,60,70,.06),inset 0 1px 0 rgba(255,255,255,.85);transition:.15s}
.chat-item:active{transform:scale(.985);background:rgba(255,255,255,.85)}
.chat-item.pinned{background:rgba(255,255,255,.84)}
.chat-item .name{font-size:15px;font-weight:600;color:#25262b}
.chat-item .prev{font-size:12.5px;color:#8b93a0;margin-top:3px}
.chat-item .time{font-size:11px;color:#a2aab6;white-space:nowrap}
.badge{min-width:18px;height:18px;border-radius:9px;background:#ff4d5f;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;margin-top:4px}
.mini-btn{border:0;background:transparent;color:#9aa3b0;padding:6px;cursor:pointer;display:grid;place-items:center}
/* ---------- 字卡库 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.card-item{display:flex;gap:8px;align-items:flex-start;padding:10px;margin-bottom:8px;border-radius:16px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8)}
.card-item textarea{min-height:38px;padding:7px 9px;font-size:13.5px;background:rgba(255,255,255,.75)}
.card-item select{width:96px;flex:0 0 auto;font-size:12px;padding:7px 6px}
.grp-bar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.grp{padding:5px 11px;border-radius:20px;font-size:12px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);color:#7a8492;cursor:pointer}
.grp.on{background:#0a84ff;color:#fff;border-color:rgba(255,255,255,.6)}
/* ---------- 信箱 / 恋爱空间 ---------- */
.letter{padding:14px;margin-bottom:10px;border-radius:18px}
.love-hero{padding:18px 16px;margin-bottom:12px;border-radius:22px;text-align:center;position:relative}
.love-hero .hero-top{display:flex;align-items:center;justify-content:center;gap:6px;color:#0a84ff;font-size:12px;font-weight:600;letter-spacing:1px}
.love-hero .big-num{font-size:44px;line-height:1.15;font-weight:700;color:#0a84ff;margin:9px 0 2px;letter-spacing:-1px}
.love-hero .big-num small{font-size:15px;font-weight:600;margin-left:4px;color:#5a6572}
.love-hero .hero-sub{font-size:12px;color:#8e8e93;line-height:1.7}
.love-hero .hero-manage{position:absolute;top:12px;right:12px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.85);color:#0a84ff;border-radius:12px;padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer}
.anniv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid rgba(60,60,67,.07);font-size:13px;text-align:left}
.anniv-row:first-child{border-top:0}
.anniv-row .an{font-weight:600;color:#3d434d}
.anniv-row .ad{font-size:11px;color:#9aa2ae;margin-top:2px}
.anniv-row .av-days{font-size:12px;color:#0a84ff;font-weight:600;white-space:nowrap}
.anniv-empty{font-size:12px;color:#9aa2ae;padding:8px 2px}
.anniv-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(60,60,67,.07)}
.anniv-edit-row .grow input{margin:0}
.letter .body{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.diary{padding:14px;margin-bottom:12px;border-radius:20px}
.diary-date{font-size:12px;color:#8e8e93;letter-spacing:.5px}
.diary-text{font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;margin:9px 0}
.diary-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}
.diary-imgs .thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#f2f2f7;border:1px solid rgba(255,255,255,.9)}
.diary-imgs .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.diary-imgs .thumb button{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;border:0;background:rgba(30,30,35,.62);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.diary-reply{border-top:1px solid rgba(60,60,67,.08);margin-top:10px;padding-top:10px}
.diary-reply-item{display:flex;gap:8px;align-items:flex-start;margin-top:9px}
.diary-reply-item .txt{flex:1;min-width:0;background:#e9e9eb;border-radius:15px;padding:8px 12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.diary-reply-item .tm{font-size:10px;color:#9aa2ae;margin-top:4px}
.diary-wait{font-size:12px;color:#8e8e93;margin-top:10px}
.diary-filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
/* ---------- 恋爱空间专属风格：奶油玫瑰玻璃（只作用本板块） ---------- */
#view-diary{--rose:#e16b93;--rose-soft:#f7a8c4;background:linear-gradient(165deg,rgba(255,250,253,.94) 0%,rgba(255,244,249,.88) 46%,rgba(248,246,255,.92) 100%)}
#view-diary .card{background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.96);border-radius:24px;box-shadow:0 8px 26px rgba(190,130,160,.10),inset 0 1px 0 rgba(255,255,255,.92)}
#view-diary .card.love-hero{position:relative;overflow:hidden;background:linear-gradient(140deg,rgba(255,236,245,.93),rgba(246,239,255,.92) 58%,rgba(255,247,238,.93));border-color:rgba(255,255,255,.98);box-shadow:0 10px 30px rgba(214,140,175,.16),inset 0 1px 0 rgba(255,255,255,.95);padding:22px 16px 18px}
#view-diary .card.love-hero:before,#view-diary .card.love-hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
#view-diary .card.love-hero:before{width:120px;height:120px;top:-58px;left:-30px;background:radial-gradient(circle,rgba(255,182,210,.34),transparent 70%)}
#view-diary .card.love-hero:after{width:140px;height:140px;bottom:-80px;right:-34px;background:radial-gradient(circle,rgba(198,178,255,.28),transparent 70%)}
#view-diary .love-hero>*:not(.hero-manage){position:relative}
#view-diary .love-hero .hero-manage{position:absolute;z-index:2;top:14px;right:14px}
#view-diary .love-hero .hero-top{font-size:11px;letter-spacing:2px}
#view-diary .love-hero .big-num{font-size:48px;text-shadow:0 4px 14px rgba(225,107,147,.16)}
#view-diary .love-hero .hero-top,#view-diary .love-hero .big-num,#view-diary .love-hero .av-days,#view-diary .hero-manage{color:var(--rose)}
#view-diary .love-hero .big-num small{color:#9a7b8c}
#view-diary .love-hero .hero-manage{border-color:rgba(255,255,255,.98);background:rgba(255,255,255,.88)}
#view-diary .divider{background:rgba(214,140,175,.13)}
#view-diary .anniv-row{border-top-color:rgba(214,140,175,.13)}
/* 同页五个方框：点击其中一个，在下方展开完整板块 */
.space-caption{display:flex;align-items:center;gap:10px;margin:2px 4px 12px;color:#b18fa0;font-size:11px;font-weight:700;letter-spacing:2px}
.space-caption:before,.space-caption:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(225,107,147,.35),transparent)}
.space-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:2px 2px 16px}
.space-box{position:relative;overflow:hidden;min-height:112px;padding:14px 13px;text-align:left;border-radius:24px;border:1px solid rgba(255,255,255,.96);background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,247,251,.82));box-shadow:0 8px 22px rgba(190,130,160,.11),inset 0 1px 0 rgba(255,255,255,.95);color:#5d4c57;font-family:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.space-box:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(190,130,160,.18),inset 0 1px 0 rgba(255,255,255,.95)}
.space-box:last-child{grid-column:span 2;min-height:92px;background:linear-gradient(120deg,rgba(255,249,244,.92),rgba(255,242,248,.86) 60%,rgba(247,243,255,.9))}
.space-box:before{content:"";position:absolute;width:74px;height:74px;border-radius:50%;right:-22px;bottom:-30px;background:rgba(225,107,147,.07)}
.space-box[data-t="mood"]{background:linear-gradient(145deg,rgba(255,248,252,.94),rgba(255,236,246,.86))}
.space-box[data-t="mood"] .sb-ic{background:#fde4ee;color:#d65b88}
.space-box[data-t="promise"]{background:linear-gradient(145deg,rgba(255,250,246,.94),rgba(255,238,232,.88))}
.space-box[data-t="promise"] .sb-ic{background:#ffe8db;color:#d9865b}
.space-box[data-t="plan"]{background:linear-gradient(145deg,rgba(247,250,255,.94),rgba(234,242,255,.88))}
.space-box[data-t="plan"] .sb-ic{background:#e3edff;color:#5b8bd6}
.space-box[data-t="period"]{background:linear-gradient(145deg,rgba(250,248,255,.94),rgba(241,236,255,.88))}
.space-box[data-t="period"] .sb-ic{background:#eee7ff;color:#9373cf}
.space-box[data-t="diary"] .sb-ic{background:#ffe6ef;color:#d65b88}
.space-box.on{border-color:rgba(225,107,147,.45);box-shadow:0 12px 30px rgba(214,91,136,.2),inset 0 1px 0 rgba(255,255,255,.95)}
.space-box.on:after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#f6aac6,#d65b88)}
.space-box .sb-ic{position:relative;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.space-box .sb-no{position:absolute;right:13px;top:12px;font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(160,125,142,.5)}
.space-box .sb-t{position:relative;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;letter-spacing:.5px}
.space-box .sb-s{position:relative;font-size:10.5px;color:#a4939e;margin-top:5px;line-height:1.5}
.space-box .sb-arrow{position:absolute;right:13px;bottom:12px;color:var(--rose-soft);font-size:13px}
.space-detail{position:relative;padding-top:14px;animation:spaceIn .22s ease-out}
.space-detail:before{content:"";display:block;height:3px;width:54px;border-radius:3px;background:linear-gradient(90deg,#f6aac6,#d65b88);margin:0 auto 14px}
@keyframes spaceIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.space-back{display:inline-flex;align-items:center;gap:5px;margin:0 0 12px;padding:7px 13px;border-radius:16px;border:1px solid rgba(255,255,255,.96);background:rgba(255,255,255,.86);color:var(--rose);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(190,130,160,.1)}
.space-head{justify-content:flex-start;color:#a88b9a;font-size:11px;letter-spacing:1.5px}
.space-head:before{content:"";width:14px;height:1px;background:rgba(225,107,147,.5)}
.space-head{display:flex;align-items:center;gap:8px;margin:4px 2px 12px;color:#8d7382;font-size:12px;font-weight:600;letter-spacing:1px}
.space-head .ic{color:var(--rose)}
.space-card{padding:15px;margin-bottom:12px}
.space-card h5{margin:0 0 10px;font-size:14px;font-weight:600;color:#5d4c57;display:flex;align-items:center;gap:7px}
.space-card h5 .ic{color:var(--rose)}
.space-note{font-size:11.5px;color:#a4939e;line-height:1.7;margin-top:9px}
.mood-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mood-cell{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.92);border-radius:18px;padding:10px}
.mood-cell .who{font-size:11.5px;color:#a4939e;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.mood-picker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.mood-pick{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.8);font-size:18px;display:grid;place-items:center;cursor:pointer;padding:0;transition:.15s}
.mood-pick.on{background:rgba(225,107,147,.16);border-color:var(--rose);transform:scale(1.09)}
.mood-cell textarea{font-size:13px;min-height:52px;background:rgba(255,255,255,.8)}
.mood-day{padding:13px;margin-bottom:10px;border-radius:20px}
.mood-day .d{font-size:12px;font-weight:600;color:var(--rose);margin-bottom:9px}
.mood-side{display:flex;gap:9px;align-items:flex-start;margin-top:7px;font-size:13px;line-height:1.6}
.mood-side .e{font-size:22px;line-height:1.2}
.mood-side .t{color:#5d4c57;white-space:pre-wrap;word-break:break-word}
.space-item{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin-bottom:9px;border-radius:18px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.92)}
.space-item.done{opacity:.62}
.space-item.done .tx{text-decoration:line-through}
.space-item .tx{flex:1;min-width:0;font-size:13.5px;color:#5d4c57;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.space-item .dt{font-size:11px;color:#a4939e;margin-top:3px}
.space-check{width:23px;height:23px;flex:0 0 auto;border-radius:50%;border:1.6px solid var(--rose-soft);background:rgba(255,255,255,.9);cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;margin-top:1px}
.space-check.on{background:var(--rose);border-color:var(--rose)}
.space-progress{height:7px;border-radius:7px;background:rgba(225,107,147,.14);overflow:hidden;margin:8px 0 12px}
.space-progress i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#f6aac6,var(--rose));transition:.3s}
/* 计划 = 普通日程表 */
.sch-group{margin-bottom:14px}
.sch-day{display:flex;align-items:center;gap:8px;margin:0 2px 9px;font-size:11.5px;font-weight:700;color:var(--rose);letter-spacing:.5px}
.sch-day .badge{padding:2px 8px;border-radius:10px;background:rgba(225,107,147,.12);font-size:10px;font-weight:600;color:#d65b88}
.sch-day .cnt{font-size:10.5px;color:#b09ca7;font-weight:500}
.sch-row{display:flex;gap:9px;align-items:stretch;margin-bottom:0}
.sch-time{flex:0 0 44px;text-align:right;font-size:11px;color:#9b8492;padding-top:13px;font-variant-numeric:tabular-nums}
.sch-axis{flex:0 0 10px;position:relative;display:flex;justify-content:center}
.sch-axis:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(225,107,147,.22)}
.sch-axis i{position:relative;z-index:1;margin-top:15px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--rose);box-sizing:content-box}
.sch-row:first-of-type .sch-axis:before{top:15px}
.sch-row:last-of-type .sch-axis:before{bottom:calc(100% - 19px)}
.sch-card{flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;padding:10px 11px;border-radius:16px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.94)}
.sch-card.today{background:linear-gradient(120deg,rgba(255,240,247,.95),rgba(255,255,255,.85));border-color:rgba(225,107,147,.24)}
.sch-card.done{opacity:.6}
.sch-card.done .sch-title{text-decoration:line-through}
.sch-body{flex:1;min-width:0}
.sch-title{font-size:13.5px;font-weight:600;color:#5d4c57;line-height:1.5;word-break:break-word}
.sch-note{font-size:11px;color:#a4939e;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.period-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.94);border-radius:18px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--rose);line-height:1.4}
.stat span{font-size:10.5px;color:#a4939e}
.tag-bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tag{padding:5px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.78);font-size:11.5px;color:#9b7f8d;cursor:pointer}
.tag.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.space-empty{text-align:center;color:#b09ca7;font-size:12.5px;padding:26px 16px;line-height:1.9}
/* 情绪：完整月历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head b{font-size:14px;color:#5d4c57;font-weight:700}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.85);color:var(--rose);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:#b09ca7;padding:4px 0 6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{min-width:0;min-height:58px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);padding:4px 2px;cursor:pointer;text-align:center;transition:.15s}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.has{background:rgba(255,246,251,.92);border-color:rgba(225,107,147,.18)}
.cal-cell.today{border-color:var(--rose);box-shadow:0 0 0 1px rgba(225,107,147,.25)}
.cal-cell:hover{transform:translateY(-1px)}
.cal-cell .cal-d{font-size:10.5px;color:#8d7382;font-weight:600;line-height:1.35}
.cal-cell.today .cal-d{color:var(--rose)}
.cal-cell .cal-line{font-size:9.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell .cal-line.me{color:#d65b88}
.cal-cell .cal-line.ta{color:#5b8bd6}
.cal-cell .cal-line.none{color:#d8ccd2}
.cal-cell .cal-line.pending{color:#c49caf}
.cal-legend{display:flex;gap:14px;justify-content:center;font-size:10.5px;color:#a4939e;margin-top:10px}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.mood-full{padding:10px 0;border-bottom:1px solid rgba(214,140,175,.13)}
.mood-full:first-child{padding-top:0}
/* 约法三章 */
.pact-intro{text-align:center;font-size:11.5px;color:#a4939e;line-height:1.8;margin:-2px 0 12px}
.pact{position:relative;display:flex;gap:11px;align-items:flex-start;padding:14px 12px;margin-bottom:10px;border-radius:18px;background:linear-gradient(140deg,rgba(255,249,252,.9),rgba(255,255,255,.8));border:1px dashed rgba(225,107,147,.35)}
.pact.done{background:linear-gradient(140deg,rgba(250,246,250,.85),rgba(255,255,255,.78))}
.pact-no{flex:0 0 32px;text-align:center;border-right:1px solid rgba(225,107,147,.22);padding-right:7px;font-size:10.5px;line-height:1.5;color:var(--rose);font-weight:700}
.pact-no b{display:block;font-size:20px;line-height:1.35;font-weight:700}
.pact-body{flex:1;min-width:0}
.pact-text{font-size:14px;line-height:1.75;color:#5d4c57;white-space:pre-wrap;word-break:break-word}
.pact.done .pact-text{color:#9b8b94}
.pact-date{font-size:10.5px;color:#a4939e;margin-top:5px}
.pact-ops{display:flex;align-items:center;gap:8px;margin-top:9px}
.pact-ops .btn{padding:4px 10px;font-size:11px}
.seal{width:50px;height:50px;flex:0 0 auto;border-radius:50%;border:2px dashed rgba(225,107,147,.5);background:rgba(255,255,255,.6);color:#c19aa9;font-size:10px;font-weight:700;line-height:1.2;cursor:pointer;transform:rotate(-11deg);display:grid;place-items:center;padding:0;font-family:inherit}
.seal.on{border:2px solid #d65b88;background:#d65b88;color:#fff;box-shadow:0 4px 12px rgba(214,91,136,.3)}
/* 恋爱空间弹窗沿用玫瑰色 */
.rose-modal{--rose:#e16b93;--rose-soft:#f7a8c4}
.rose-modal .btn{color:var(--rose)}
.rose-modal .btn.primary{background:linear-gradient(135deg,#ea7ea7,#d65b88);color:#fff;border-color:rgba(255,255,255,.6)}
.rose-modal .mood-pick.on{border-color:var(--rose)}
.rose-modal .tag.on{background:var(--rose);border-color:var(--rose)}
.rose-modal .mini-x{color:var(--rose)}
.space-head .ic,.space-card h5 .ic{display:inline-flex;align-items:center}
#view-diary .btn{color:var(--rose)}
#view-diary .btn.primary{background:linear-gradient(135deg,#ea7ea7,#d65b88);color:#fff;border-color:rgba(255,255,255,.6);box-shadow:0 6px 16px rgba(214,91,136,.24)}
#view-diary input:focus,#view-diary textarea:focus,#view-diary select:focus{border-color:rgba(225,107,147,.55);box-shadow:0 0 0 3px rgba(225,107,147,.10)}
#view-diary .mini-x{color:var(--rose)}
#view-diary .diary-reply-item .txt{background:rgba(255,237,245,.94)}
/* ---------- 聊天页（iMessage） ---------- */
/* 聊天页：严格 iMessage —— 不透明白底，不做半透明玻璃 */
.chat-page{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:#ffffff}
.chat-page.active{display:flex}
.ch-head{
  flex:0 0 auto;position:relative;z-index:3;height:74px;height:calc(74px + env(safe-area-inset-top,0px));padding:0 12px;padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(60,60,67,.12);
}
.ch-back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:15px;cursor:pointer;background:transparent;border:0;padding:6px 4px;min-width:66px}
.ch-who{position:absolute;left:50%;top:37px;top:calc(env(safe-area-inset-top,0px) + 37px);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.ch-who .av{width:30px;height:30px;font-size:12px;border-width:1px}
.ch-who span{font-size:11px;color:#4a4d55;font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-head-r{min-width:66px;display:flex;justify-content:flex-end;gap:4px}
.ch-head-r button{border:0;background:transparent;color:var(--blue);padding:6px;cursor:pointer;display:grid;place-items:center}
#chat-msgs{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;padding:16px 14px 10px;-webkit-overflow-scrolling:touch}
#chat-msgs::-webkit-scrollbar{width:0}
.mrow{display:flex;margin-bottom:var(--msg-gap);flex-direction:column;align-items:flex-start}
.mrow.me{align-items:flex-end}
.mb-wrap{max-width:78%;display:flex;flex-direction:column;align-items:flex-start}
.mrow.me .mb-wrap{align-items:flex-end}
.bubble{
  position:relative;font-size:var(--bubble-font);line-height:1.45;padding:var(--bubble-pad);
  border-radius:18px;word-break:break-word;white-space:pre-wrap;
  background:var(--in-bg);color:#1c1c1e;border:0;
}
.mrow.me .bubble{background:#0a84ff;color:#fff}
.bubble img,.bubble video{max-width:210px;max-height:260px;width:100%;border-radius:12px;display:block;object-fit:cover}
.bubble.emoji{font-size:44px;padding:6px 10px;background:transparent;border:0;box-shadow:none}
.bubble.cardmsg{background:#f2f2f7}
.mrow.me .bubble.cardmsg{background:#0a84ff}
.bubble.sys{background:#f2f2f7;color:#8e8e93;font-size:12px;text-align:center;border-radius:14px}
.m-meta{font-size:10px;color:#9aa2ae;margin-top:4px;padding:0 3px;display:flex;gap:6px;align-items:center}
.mrow.me .m-meta{justify-content:flex-end}
/* 对方正在输入：三个跳动的点（灰胶囊，无小尾巴） */
.typing-row{display:flex;align-items:flex-end;margin-bottom:var(--msg-gap)}
.typing-bubble{display:flex;align-items:center;gap:5px;height:30px;padding:0 13px;border-radius:16px;background:#e9e9eb}
.typing-bubble i{width:8px;height:8px;border-radius:50%;background:#8e8e93;display:block;animation:dotJump 1.25s infinite ease-in-out}
.typing-bubble i:nth-child(2){animation-delay:.16s}
.typing-bubble i:nth-child(3){animation-delay:.32s}
@keyframes dotJump{0%,70%,100%{opacity:.35;transform:translateY(0) scale(.85)}35%{opacity:1;transform:translateY(-6px) scale(1.1)}}
.ch-foot{
  position:relative;z-index:3;flex:0 0 auto;padding:9px 10px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid rgba(60,60,67,.12);
}
.ch-input-row{display:flex;align-items:flex-end;gap:8px}
.circle-btn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid #d1d1d6;background:#f2f2f7;color:#8e8e93;display:grid;place-items:center;cursor:pointer;transition:.2s}
.circle-btn.on{transform:rotate(45deg);color:var(--blue)}
.circle-btn.send{background:#0a84ff;color:#fff;border-color:#0a84ff}
.input-shell{flex:1;min-height:34px;border-radius:18px;border:1px solid #d1d1d6;background:#ffffff;display:flex;align-items:center;padding:2px 10px}
#chat-input{border:0;background:transparent;box-shadow:none;padding:6px 2px;font-size:15px;max-height:96px;resize:none;line-height:1.4}
#chat-input:focus{border:0;box-shadow:none}
.plus-panel{display:none;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 8px 8px}
.plus-panel.show{display:grid}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#5d6775;cursor:pointer}
.plus-item .ib{width:52px;height:52px;border-radius:17px;background:#f2f2f7;border:1px solid #e5e5ea;display:grid;place-items:center;color:#0a84ff}
.emoji-panel{display:none;flex-wrap:wrap;gap:4px;padding:12px 4px 4px;max-height:180px;overflow-y:auto}
.emoji-panel.show{display:flex}
.emoji-panel span{font-size:26px;padding:5px;cursor:pointer}
/* 有自定义背景时，上下框也透出背景（覆盖上下框） */
#app.has-chatbg .ch-head,#app.has-chatbg .ch-foot{background:rgba(255,255,255,.55)}
/* ---------- 引用回复 / 删除消息 ---------- */
.bubble{cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bubble video{cursor:default}
.quote-in{position:relative;display:block;margin:0 0 7px;padding:6px 26px 6px 9px;border-radius:9px;background:rgba(0,0,0,.055);border-left:3px solid rgba(10,132,255,.6);font-size:12px;line-height:1.5;white-space:normal}
.q-jump{position:absolute;right:5px;top:5px;width:20px;height:20px;border:0;border-radius:6px;background:rgba(10,132,255,.12);color:#0a84ff;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.mrow.me .q-jump{background:rgba(255,255,255,.24);color:#fff}
.mrow.me .quote-in{background:rgba(255,255,255,.19);border-left-color:rgba(255,255,255,.85);color:rgba(255,255,255,.95)}
.quote-in .q-who{font-size:11px;font-weight:600;opacity:.85;margin-bottom:2px}
.quote-in .q-txt{white-space:pre-wrap;word-break:break-word;opacity:.9;max-height:62px;overflow:hidden}
.quote-bar{display:none;align-items:center;gap:8px;margin:0 2px 9px;padding:8px 10px;border-radius:14px;background:#f2f2f7;border-left:3px solid #0a84ff}
.quote-bar.show{display:flex}
.quote-bar .qb-body{flex:1;min-width:0}
.quote-bar .qb-who{font-size:11px;font-weight:600;color:#0a84ff}
.quote-bar .qb-txt{font-size:12.5px;color:#454a54;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-bar .qb-x{width:24px;height:24px;flex:0 0 auto;border:0;border-radius:50%;background:rgba(60,60,67,.1);color:#6a707c;display:grid;place-items:center;cursor:pointer;padding:0}
.msg-sheet{position:absolute;inset:0;z-index:60;display:none}
.msg-sheet.show{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(20,24,32,.28)}
.sheet-box{position:absolute;left:8px;right:8px;bottom:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:20px;padding:8px;background:rgba(255,255,255,.96);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 -10px 36px rgba(0,0,0,.18)}
.sheet-preview{padding:10px 12px 12px;border-bottom:1px solid rgba(60,60,67,.10);font-size:12.5px;color:#6a707c;line-height:1.6;max-height:86px;overflow:hidden;white-space:pre-wrap;word-break:break-word;text-align:center}
.sheet-btn{width:100%;border:0;background:transparent;color:#0a84ff;font-size:16px;font-weight:500;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit}
.sheet-btn:active{background:#f2f2f7}
.sheet-btn.danger{color:#ff3b30}
.sheet-btn.cancel{color:#3a3a40;font-weight:600;border-top:6px solid rgba(60,60,67,.06);border-radius:0 0 14px 14px}
/* ---------- 弹窗 / 提示 ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(30,40,60,.22);backdrop-filter:blur(6px)}
#modal-root.show{display:flex}
.modal{width:min(460px,100%);max-height:86vh;max-height:86dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:16px 18px 24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.78);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.9);box-shadow:0 -10px 40px rgba(90,120,160,.18)}
@media(min-width:520px){#modal-root{align-items:center}.modal{border-radius:26px;padding-bottom:22px}}
.modal h3{margin:2px 0 14px;font-size:17px;text-align:center;font-weight:600}
.modal .foot{display:flex;gap:8px;margin-top:16px}
.modal .foot .btn{flex:1}
#toast{position:fixed;z-index:200;left:50%;top:12%;transform:translateX(-50%) translateY(-10px);opacity:0;pointer-events:none;transition:.25s;background:rgba(40,44,52,.82);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;backdrop-filter:blur(10px);max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 通话（可最小化） ---------- */
#call-overlay{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.86);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);color:#2b2f36}
#call-overlay.show{display:flex}
.call-full{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#call-overlay .av{width:110px;height:110px;font-size:40px;box-shadow:0 16px 40px rgba(60,70,85,.18)}
#call-overlay .cname{font-size:22px;font-weight:600}
#call-overlay .cstate{font-size:14px;color:#8e8e93}
#call-overlay .cbtn{width:66px;height:66px;border-radius:50%;border:0;background:#ff5b6e;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(255,91,110,.30);margin-top:26px}
.call-acts{display:flex;align-items:center;gap:44px;margin-top:26px}
.call-acts .cbtn{margin-top:0}
#call-overlay .cbtn.answer{background:#30c76b;box-shadow:0 10px 24px rgba(48,199,107,.30)}
#call-overlay .cbtn.reject{background:#ff5b6e}
.call-acts .act-label{font-size:11px;color:#8e8e93;text-align:center;margin-top:7px}
.call-act{display:flex;flex-direction:column;align-items:center}
#call-overlay .cmini-btn{position:absolute;top:18px;top:calc(18px + env(safe-area-inset-top,0px));right:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.8);color:#3a3a40;display:grid;place-items:center;cursor:pointer}
/* 最小化：只有一个头像大小的悬浮球，块上没有文字也没有额外面板 */
#call-overlay.mini{inset:auto 14px 80px auto;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:var(--avatar-radius);padding:0;background:#ffffff;border:0;box-shadow:0 8px 24px rgba(60,70,85,.26);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden}
#call-overlay.mini .call-full,#call-overlay.mini .cmini-btn{display:none}
.call-mini{display:none;position:relative;width:100%;height:100%}
#call-overlay.mini .call-mini{display:block}
#call-overlay.mini .call-mini .av{width:100%!important;height:100%!important;font-size:21px!important;border:0!important;border-radius:var(--avatar-radius)!important;box-shadow:none!important}
.mini-hang{position:absolute;bottom:2px;right:2px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:#ff5b6e;color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2;padding:0;box-shadow:0 2px 6px rgba(255,91,110,.4)}
/* ---------- 设置 ---------- */
.set-group{padding:14px;margin-bottom:12px;border-radius:20px}
.set-group h4{margin:0 0 10px;font-size:13px;color:#3d6fae;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(60,60,67,.07);font-size:13px}
.set-line:last-child{border-bottom:0}
.set-line .lb{flex:1;min-width:0;color:#3d434d}
.set-line .hint{font-size:11px;color:#9aa3b0;margin-top:2px}
.set-line input[type=number]{width:88px;text-align:center}
.set-line .val{font-size:12px;color:var(--blue);min-width:44px;text-align:right}
.mini-x{border:0;background:transparent;color:#e0536b;cursor:pointer;padding:4px}
.file-btn{position:relative;overflow:hidden}

<body>
<div id="app">
  <header id="topbar">
    <div class="tb-title" id="tb-title">传讯</div>
    <button class="tb-btn" data-act="add-char" title="添加梦角"></button>
  </header>
  <main id="views">
    <section class="view active" id="view-chats"><div id="chat-list"></div></section>

function normalize(s){
  const d=defaultState();
  s=s||{};
  const raw=s.settings||{},st=Object.assign({},d.settings,raw);
  /* 迁移要看「原始数据」里有没有这些字段，否则会被默认值覆盖 */
  [['replyDelay','replyDelayMin','replyDelayMax'],['mailboxDelay','mailboxDelayMin','mailboxDelayMax']].forEach(([old,k1,k2])=>{
    if(raw[old]!=null){
      if(raw[k1]==null)st[k1]=raw[old];
      if(raw[k2]==null)st[k2]=raw[old];
    }
    delete st[old];
  });
  /* v1 旧数据：信箱按秒存储，统一换算成分钟；聊天回复仍按秒 */
  if(!s.dataVersion||s.dataVersion<2){
    ['mailboxDelayMin','mailboxDelayMax'].forEach(k=>{
      if(st[k]!=null)st[k]=Math.round((Number(st[k])||0)/60*100)/100;
    });
    delete st.timeUnit;
  }
  /* 旧版「每次回复字卡数」单值迁移成区间 */
  if(raw.cardsPerReply!=null){
    if(raw.cardsPerReplyMin==null)st.cardsPerReplyMin=raw.cardsPerReply;
    if(raw.cardsPerReplyMax==null)st.cardsPerReplyMax=raw.cardsPerReply;
  }
  /* 旧版「信箱每次回信字卡数」单值迁移成区间 */
  if(raw.mailboxCards!=null){
    if(raw.mailboxCardsMin==null)st.mailboxCardsMin=raw.mailboxCards;
    if(raw.mailboxCardsMax==null)st.mailboxCardsMax=raw.mailboxCards;
  }
  /* 对方来电概率锁定在 1—100%：0 抬到 1，越界压回边界，没设过用默认 20 */
  st.incomingCallProb=clamp(st.incomingCallProb==null?20:Number(st.incomingCallProb),1,100);
  /* 清掉已下线的旧功能数据与设置，不留残骸 */
  ['cardsPerReply','questions','mailboxCards','momentsDelay','momentsDelayMin','momentsDelayMax','momentsCards','momentsAuto'].forEach(k=>delete st[k]);
  delete s.moments;
  st.taMoodPickHour=clamp(Number(st.taMoodPickHour)||0,0,23);
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(st.taMoodReveal||'')))st.taMoodReveal='23:55';
  s.dataVersion=7;
  s.settings=st;
  ['cards','groups','chars','letters','diaries','anniversaries','moods','promises','plans','periods','taMoodSkip'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=d[k]});
  s.diaries.forEach(x=>{if(!Array.isArray(x.images))x.images=[];if(!Array.isArray(x.replies))x.replies=[]});
  s.moods.forEach(x=>{x.me=x.me||{emoji:'',text:''};x.ta=x.ta||{emoji:'',text:''}});
  s.periods.forEach(x=>{if(!Array.isArray(x.symptoms))x.symptoms=[]});
  s.loveDate=String(s.loveDate||'');
  s.anniversaries=s.anniversaries.filter(x=>x&&x.date).map(x=>({id:x.id||uid(),name:String(x.name||'纪念日'),date:String(x.date)}));
  if(!s.me)s.me=d.me;
  s.chars.forEach(c=>{if(!Array.isArray(c.msgs))c.msgs=[];c.typing=false;c.unread=c.unread||0});
  return s;
}

function cardsOf(group){return group?state.cards.filter(c=>(c.group||'')===group):state.cards}
function pickCards(n,group){
  const pool=cardsOf(group).map(c=>c.text).filter(t=>String(t).trim());
  if(!pool.length)return [];
  const out=[],bag=pool.slice();
  for(let i=0;i<n;i++){if(!bag.length)bag.push(...pool);const k=Math.floor(Math.random()*bag.length);out.push(bag.splice(k,1)[0])}
  return out;
}
function parseCards(text,filename){
  const raw=String(text||'').replace(/^\uFEFF/,'').trim();
  if(!raw)return [];
  let arr=[],j=null;
  const isJson=/\.json$/i.test(filename);
  if(isJson||raw.startsWith('[')||raw.startsWith('{')){
    try{j=JSON.parse(raw)}catch(e){if(isJson){toast('JSON 解析失败，请检查格式');return []}}
  }
  if(j!==null&&typeof j==='object'){
    if(Array.isArray(j))arr=j.map(x=>typeof x==='string'?{text:x,group:''}:{text:(x&&(x.text||x.content||x.card))||'',group:(x&&(x.group||x.分组))||''});
    else if(Array.isArray(j.cards))arr=j.cards.map(x=>typeof x==='string'?{text:x,group:''}:{text:x.text||x.content||'',group:x.group||''});
    else Object.keys(j).forEach(g=>{if(Array.isArray(j[g]))j[g].forEach(x=>arr.push({text:typeof x==='string'?x:(x&&(x.text||x.content)||''),group:g}))});
  }else{
    raw.split(/\r?\n/).forEach(line=>{
      const t=line.trim();if(!t)return;
      let m=t.match(/^【(.+?)】\s*(.+)$/);
      if(m){arr.push({group:m[1],text:m[2]});return}
      m=t.match(/^\[(.+?)\]\s*(.+)$/);
      if(m){arr.push({group:m[1],text:m[2]});return}
      m=t.match(/^(.+?)[|｜]\s*(.+)$/);
      if(m){arr.push({group:m[1].trim(),text:m[2].trim()});return}
      arr.push({group:'',text:t});
    });
  }
  return arr.filter(x=>String(x.text||'').trim());
}
function doImport(file){

      <input id="imp-group" placeholder="可留空">

        <button class="btn primary" data-act="imp-mode" data-mode="append">追加到字卡库</button>
      </div>`,()=>{
        window._importData=arr;
      });
  });
}
function dedupe(){
  const seen=new Set(),before=state.cards.length;
  state.cards=state.cards.filter(c=>{const t=String(c.text||'').trim();if(!t||seen.has(t))return false;seen.add(t);return true});
  save();renderCards();toast('已去除 '+(before-state.cards.length)+' 张重复字卡');
}
function exportCards(fmt){
  if(!state.cards.length){toast('字卡库是空的');return}

    download('字卡库.json',JSON.stringify(state.cards.map(c=>({text:c.text,group:c.group||'默认'})),null,2),'application/json;charset=utf-8');
  }else{

function charName(c){return c.nickname&&String(c.nickname).trim()?c.nickname:c.name}
function sortedChars(){return state.chars.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.lastTs||0)-(a.lastTs||0))}
function renderChats(){
  const cs=sortedChars();
  if(!cs.length){$('#chat-list').innerHTML='<div class="empty">还没有梦角<br>点右上角 ＋ 把 TA 加进来</div>';return}
  let html='';
  const pin=cs.filter(c=>c.pinned),rest=cs.filter(c=>!c.pinned);
  const block=(arr,title)=>{
    if(!arr.length)return '';
    return '<div class="sec">'+title+'</div>'+arr.map(c=>{
      const last=c.msgs.length?c.msgs[c.msgs.length-1]:null;
      let prev='还没有消息，去说点什么吧';
      if(last)prev=(last.quote?'↩ ':'')+(last.from==='me'?'我：':'')+(last.type==='image'?'[照片]':last.type==='video'?'[视频]':last.type==='emoji'?'[表情包]':last.type==='call'?'[通话]':String(last.text||'').replace(/\n/g,' '));
      return '<div class="chat-item '+(c.pinned?'pinned':'')+'" data-act="open-chat" data-id="'+c.id+'">'
        +avatar(charName(c),c.avatar)
        +'<div class="grow"><div class="row between"><div class="name ell">'+esc(charName(c))+(c.pinned?' <span class="pill">置顶</span>':'')+'</div><div class="time">'+shortT(c.lastTs||Date.now())+'</div></div>'
        +'<div class="row between"><div class="prev ell grow">'+esc(prev)+'</div>'+(c.unread?'<div class="badge">'+c.unread+'</div>':'')+'</div></div>'
        +'<button class="mini-btn" data-act="char-menu" data-id="'+c.id+'">'+icon('more',18)+'</button></div>';
    }).join('');
  };
  html=block(pin,'置顶')+block(rest,'全部传讯');
  $('#chat-list').innerHTML=html;
}

function addLetter(charId,type,text){state.letters.push({id:uid(),charId,type,text:String(text||''),ts:Date.now()});save()}
function mailReply(charId){
  const n=randInt(state.settings.mailboxCardsMin,state.settings.mailboxCardsMax);
  const cards=pickCards(n,state.settings.cardGroup);
  if(!cards.length){toast('字卡库是空的，先去添加字卡吧');return}
  addLetter(charId,'in',cards.join('\n'));
  const c=state.chars.find(x=>x.id===charId);
  if(c){c.unread=(c.unread||0)+1}
  renderMail();renderChats();toast('收到一封来自'+(c?charName(c):'梦角')+'的信');
}
function scheduleMail(){
  const cid=window._mailChar||(state.chars[0]&&state.chars[0].id);
  clearTimeout(window._mailTimer);
  window._mailPending=true;renderMail();
  window._mailTimer=setTimeout(()=>{
    window._mailPending=false;
    if(cid)mailReply(cid);
  },randMin(state.settings.mailboxDelayMin,state.settings.mailboxDelayMax));
}
/* 所有等待都是「区间内随机一个时刻」，到点抽卡 */
function loopMail(){
  clearTimeout(window._autoMailTimer);
  if(!state.settings.mailAuto)return;
  window._autoMailTimer=setTimeout(()=>{
    const cs=state.chars;const c=cs[Math.floor(Math.random()*cs.length)];
    if(c)mailReply(c.id);
    loopMail();
  },randMin(state.settings.mailboxDelayMin,state.settings.mailboxDelayMax));
}
function restartAuto(){loopMail()}

const DIARY_WEEK=['周日','周一','周二','周三','周四','周五','周六'];
function day0(s){const a=String(s||'').split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)}
function today0(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function diffDays(a,b){return Math.round((b-a)/86400000)}
function nextAnniv(dateStr){
  const d=day0(dateStr),t=today0();
  let nx=new Date(t.getFullYear(),d.getMonth(),d.getDate());
  if(nx<t)nx=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());
  return nx;
}

let diaryTimers={};
function clearDiaryTimers(){Object.keys(diaryTimers).forEach(k=>clearTimeout(diaryTimers[k]));diaryTimers={}}
/* 到点后，按「每次回复条数区间」从字卡库随机抽卡，写进这篇日记 */
function diaryReply(d){
  if(!state.diaries.some(x=>x.id===d.id))return;
  const s=state.settings,n=randInt(s.diaryCardsMin,s.diaryCardsMax);
  const cards=pickCards(n,s.cardGroup);
  if(!Array.isArray(d.replies))d.replies=[];
  if(!cards.length)d.replies.push({text:'（字卡库是空的，先去添加一些字卡吧）',ts:Date.now()});
  else cards.forEach((t,i)=>d.replies.push({text:t,ts:Date.now()+i*450}));
  d.replyAt=0;
  delete diaryTimers[d.id];
  save();renderDiary();
  const c=state.chars.find(x=>x.id===d.charId);
  toast((c?charName(c):'梦角')+' 在空间日记下留了 '+ (cards.length||1) +' 条字卡');
}
function scheduleDiary(d){
  clearTimeout(diaryTimers[d.id]);
  const wait=randMin(state.settings.diaryDelayMin,state.settings.diaryDelayMax);
  d.replyAt=Date.now()+wait;
  diaryTimers[d.id]=setTimeout(()=>diaryReply(d),wait);
}
/* 刷新页面后，把还没到点的日记回复接回来 */
function restoreDiaryTimers(){
  clearDiaryTimers();
  state.diaries.forEach(d=>{
    if(!d.replyAt)return;
    if(d.replyAt<=Date.now()){diaryReply(d);return}
    diaryTimers[d.id]=setTimeout(()=>diaryReply(d),d.replyAt-Date.now());
  });
}

const MOOD_EMOJIS=['🥰','😊','😌','😐','🥺','😢','😡','😴','✨'];

function revealTs(date){
  const hm=String(state.settings.taMoodReveal||'23:55').split(':').map(Number);
  const d=day0(date);d.setHours(hm[0]==null?23:hm[0],hm[1]==null?55:hm[1],0,0);
  return d.getTime();
}
function taRevealed(m){return !m.taAuto||!m.taAuto.revealAt||Date.now()>=m.taAuto.revealAt}
function moodCellEmoji(recs,who){
  const arr=[...new Set(recs.filter(r=>who!=='ta'||taRevealed(r)).map(r=>(r[who]||{}).emoji).filter(Boolean))].slice(0,2).join('');
  return arr||'';
}
/* TA 的情绪：到设定小时自动抽好（可附带字卡），但只在每日「揭晓时刻」显示 */
function taMoodGenerate(date){
  const s=state.settings,cid=(state.chars[0]&&state.chars[0].id)||'';
  if(!cid)return;
  const n=randInt(s.taMoodCardsMin,s.taMoodCardsMax);
  const cards=pickCards(n,s.cardGroup);
  const emoji=MOOD_EMOJIS[Math.floor(Math.random()*MOOD_EMOJIS.length)];
  let rec=state.moods.find(x=>x.date===date&&x.charId===cid);
  if(!rec){rec={id:uid(),date,charId:cid,me:{emoji:'',text:''},ta:{emoji:'',text:''},ts:Date.now()};state.moods.push(rec)}
  rec.ta={emoji,text:cards.length?cards.join('\n'):''};
  rec.taAuto={pickedAt:Date.now(),revealAt:revealTs(date),cards:n};
  save();
}
function checkTaMood(){
  const s=state.settings;if(!s.taMoodAuto)return;
  const now=new Date(),date=todayStr(),hour=clamp(Number(s.taMoodPickHour)||0,0,23);
  if(now.getHours()<hour)return;
  if((state.taMoodSkip||[]).includes(date))return;
  const cid=(state.chars[0]&&state.chars[0].id)||'';if(!cid)return;
  const rec=state.moods.find(x=>x.date===date&&x.charId===cid);
  if(rec&&rec.taAuto)return;
  if(rec&&!rec.taAuto&&rec.ta&&(rec.ta.emoji||rec.ta.text))return;
  taMoodGenerate(date);
  if(curTab==='diary')renderDiary();
}
function skipTaMood(date){
  if(!Array.isArray(state.taMoodSkip))state.taMoodSkip=[];
  if(!state.taMoodSkip.includes(date))state.taMoodSkip.push(date);
  if(state.taMoodSkip.length>400)state.taMoodSkip=state.taMoodSkip.slice(-200);
}
function refreshTaReveal(){
  state.moods.forEach(m=>{if(m.taAuto&&m.taAuto.revealAt)m.taAuto.revealAt=revealTs(m.date)});
  save();scheduleTaReveal();
}
function scheduleTaReveal(){
  clearTimeout(window._taRevealTimer);
  const pend=state.moods.filter(x=>x.taAuto&&!taRevealed(x)).map(x=>x.taAuto.revealAt).filter(t=>t>Date.now());
  if(!pend.length)return;
  const next=Math.min(...pend);

function periodStats(){
  const ps=state.periods.slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
  if(!ps.length)return null;
  const last=ps[ps.length-1];
  const gaps=[];
  for(let i=1;i<ps.length;i++){const g=diffDays(day0(ps[i-1].start),day0(ps[i].start));if(g>=15&&g<=60)gaps.push(g)}
  const cycle=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):28;
  const lens=ps.filter(x=>x.end).map(x=>diffDays(day0(x.start),day0(x.end))+1).filter(n=>n>0&&n<=15);
  const len=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):5;
  const nx=new Date(day0(last.start).getTime()+cycle*86400000);
  const left=diffDays(today0(),nx);
  return {last,cycle,len,nx:left>=0?pad(nx.getMonth()+1)+'/'+pad(nx.getDate()):'—',left};
}

function spaceSummary(id){
  const t=todayStr();
  if(id==='mood'){
    const n=Object.keys(moodByDate()).length;
    const today=state.moods.filter(x=>x.date===t);
    const mine=today.some(x=>x.me&&(x.me.emoji||x.me.text));
    const wait=today.some(x=>x.taAuto&&!taRevealed(x));
    return '共 '+n+' 天 · '+(wait?'TA 今日待揭晓':mine?'今天已记':'今天未记');
  }
  if(id==='promise')return state.promises.length+' 章 · 兑现 '+state.promises.filter(x=>x.done).length;
  if(id==='plan')return state.plans.length+' 项 · 完成 '+state.plans.filter(x=>x.done).length;
  if(id==='period'){
    const st=periodStats();
    return st?(st.left>=0?'距下次 '+st.left+' 天':'上次 '+st.last.start.slice(5)):'还没有记录';
  }
  if(id==='diary')return state.diaries.length+' 篇日记';
  return '';
}

function setSetting(key,val){
  if(key==='me.name'){state.me.name=val;renderChats();save();return}
  const s=state.settings;
  if(['replyDelayMin','replyDelayMax','cardsPerReplyMin','cardsPerReplyMax','mailboxDelayMin','mailboxDelayMax','mailboxCardsMin','mailboxCardsMax','diaryDelayMin','diaryDelayMax','diaryCardsMin','diaryCardsMax','taMoodPickHour','taMoodCardsMin','taMoodCardsMax','callRejectProb','incomingCallProb','readNoReplyProb','unreadProb','avatarSize','bubbleFont','bubblePadX','bubblePadY','compact','blur'].includes(key))val=Number(val)||0;
  if(['glassAlpha','chatBgOpacity'].includes(key))val=Number(val);
  if(key==='incomingCallProb')val=clamp(val,1,100);
  if(key==='taMoodPickHour')val=clamp(val,0,23);
  if(key==='taMoodReveal'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(val)))val='23:55';
  s[key]=val;applyLook();save();
  if(['taMoodReveal'].includes(key))refreshTaReveal();
  if(['taMoodAuto','taMoodPickHour'].includes(key))checkTaMood();
  if(['mailAuto','mailboxDelayMin','mailboxDelayMax'].includes(key))restartAuto();
  if(['mailboxDelayMin','mailboxDelayMax'].includes(key))renderMail();
  if(['diaryDelayMin','diaryDelayMax','diaryCardsMin','diaryCardsMax'].includes(key))renderDiary();
}

function pushMsg(c,from,type,text,src,status,quote){
  const m={id:uid(),from,type,text:String(text==null?'':text),src:src||'',ts:Date.now(),status:status||'delivered',quote:quote||null};
  c.msgs.push(m);c.lastTs=m.ts;save();

  renderChats();return m;

function sendFromMe(type,text,src){
  const c=curChar();if(!c)return;
  const q=window._quoteTarget?Object.assign({},window._quoteTarget):null;
  clearQuote();

function respond(c,myMsg){
  const s=state.settings;
  const delay=randMs(s.replyDelayMin,s.replyDelayMax);
  const n=randInt(s.cardsPerReplyMin,s.cardsPerReplyMax);
  /* 对方主动来电：与本次是否回复无关，按设置里的概率独立判定 */
  maybeIncoming(c,delay+1000+n*450);
  const r=Math.random()*100;
  if(r<Number(s.readNoReplyProb)){myMsg.status='read';save();renderChat();renderChats();return}
  if(r<Number(s.readNoReplyProb)+Number(s.unreadProb)){myMsg.status='unread';save();renderChat();renderChats();return}
  myMsg.status='read';save();renderChat();
  /* 回复时刻随机 + 本次回复的张数随机，两者都从区间里取 */
  if(s.typing){c.typing=true;if(curCharId===c.id)renderChat()}
  setTimeout(()=>{
    const cards=pickCards(n,s.cardGroup);
    if(!cards.length){c.typing=false;if(curCharId===c.id)renderChat();pushMsg(c,'char','sys','字卡库是空的，去「字卡库」添加一些吧');return}
    cards.forEach((t,i)=>setTimeout(()=>{
      c.typing=false;
      pushMsg(c,'char','text',t);
      /* 后面还有字卡时，继续显示三个跳动的点，像 TA 还在打字 */
      if(s.typing&&i<cards.length-1){c.typing=true;if(curCharId===c.id)renderChat()}
    },i*450));
  },delay);
}

function startCall(){
  const c=curChar();if(!c||callBusy())return;

  setTimeout(()=>{
    if(!ov.classList.contains('show')||ov.dataset.mode!=='out')return;
    const rejected=Math.random()*100<Number(state.settings.callRejectProb||0);
    if(rejected){
      setCallState('对方暂时无法接听');
      setTimeout(()=>{if(ov.classList.contains('show')&&ov.dataset.mode==='out')endCall('对方拒绝了通话')},1500);
    }else{setCallState('通话中 00:00');callClock(true)}

/* 每发一条消息后，按「对方主动来电概率」决定是否来电 */
function maybeIncoming(c,wait){
  const p=Number(state.settings.incomingCallProb);
  if(!(p>0)||Math.random()*100>=p)return;
  setTimeout(()=>{
    if(callBusy())return;
    openCall(c,'in');
    /* 响铃 20 秒未接听，自动记为未接来电 */
    callRingTimer=setTimeout(()=>{
      const ov=$('#call-overlay');
      if(ov.classList.contains('show')&&ov.dataset.mode==='in')endCall('未接来电');
    },20000);
  },wait);
}
function answerCall(){
  const ov=$('#call-overlay');
  if(ov.dataset.mode!=='in')return;
  clearTimeout(callRingTimer);
  ov.dataset.mode='call';
  setCallState('通话中 00:00');callClock(true);
  const acts=ov.querySelector('.call-acts');
  if(acts)acts.outerHTML='<button class="cbtn" data-act="call-end" title="挂断">'+icon('phone',26)+'</button>';
}
function endCall(note){
  const ov=$('#call-overlay');
  const wasIncoming=ov.dataset.mode==='in',cid=ov.dataset.charId;
  callClock(false);clearTimeout(callRingTimer);
  ov.classList.remove('show','mini');
  const c=state.chars.find(x=>x.id===cid)||curChar();
  if(c)pushMsg(c,'me','sys',note||(wasIncoming?'未接来电':'通话结束 '+pad(Math.floor(callSec/60))+':'+pad(callSec%60)));
}

/* ============ 一键导出 / 导入全部数据 ============ */
function exportAll(){
  const d=new Date();
  const stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
  let plain;
  try{plain=JSON.parse(JSON.stringify(state))}catch(e){toast('导出失败');return}
  plain.chars.forEach(c=>c.typing=false);
  const payload={app:'梦角传讯',format:'dreammsg-full-backup',version:plain.dataVersion,exportedAt:new Date().toISOString(),data:plain};
  download('梦角传讯_全部数据_'+stamp+'.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');
  toast('已导出全部数据（'+plain.chars.length+' 个梦角 / '+plain.cards.length+' 张字卡）');
}
function importAll(file){
  readText(file,txt=>{
    let obj;
    try{obj=JSON.parse(txt)}catch(e){toast('文件不是有效的 JSON');return}
    const d=obj&&obj.data?obj.data:obj;
    if(!d||typeof d!=='object'||!Array.isArray(d.chars)||!Array.isArray(d.cards)){toast('这不是本应用的完整备份文件');return}
    const rows=[(d.chars||[]).length+' 个梦角',(d.cards||[]).length+' 张字卡',(d.diaries||[]).length+' 篇日记',(d.moods||[]).length+' 天情绪'];
    if(!confirm('导入将整体覆盖当前全部数据，确定继续？\n\n备份内容：'+rows.join(' / ')+'\n\n建议先「导出全部数据」留一份。'))return;
    let next;
    try{next=normalize(JSON.parse(JSON.stringify(d)))}catch(e){toast('备份内容无法识别，原数据未改动');return}
    clearTimeout(saveTimer);clearDiaryTimers();
    clearTimeout(window._mailTimer);clearTimeout(window._autoMailTimer);clearTimeout(window._taRevealTimer);clearTimeout(callRingTimer);
    state=next;
    try{idbSet(JSON.parse(JSON.stringify(state)))}catch(e){}
    window._spaceOpen='';window._moodMonth='';window._moodEdit=null;window._pactEdit=null;
    window._spaceForm={};window._diaryImages=[];window._diaryText='';window._diaryDate='';window._diaryFilter='';window._periodTags=[];
    window._mailPending=false;window._mailChar='';
    curCharId=null;
    applyLook();showTab('chats');restartAuto();restoreDiaryTimers();checkTaMood();
    toast('已导入全部数据 · '+rows[0]);
  });
}
function doImportFile(){pickFile('.json,.txt,text/plain,application/json',f=>doImport(f))}
/* 字卡编辑事件 */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.cardText!==undefined){const c=state.cards.find(x=>x.id===el.dataset.cardText);if(c){c.text=el.value;save()}return}
  if(el.dataset.cardGroup!==undefined){const c=state.cards.find(x=>x.id===el.dataset.cardGroup);if(c){c.group=el.value;save()}return}
  if(el.id==='mail-char'){window._mailChar=el.value;return}
  if(el.id==='diary-char'){window._diaryChar=el.value;return}
  if(el.id==='diary-date'){window._diaryDate=el.value;return}
  if(el.id==='mood-edit-char'){
    const E=window._moodEdit;
    if(E){
      E.charId=el.value;
      const c=state.chars.find(x=>x.id===el.value),n=c?charName(c):'梦角';
      const w=$$('#modal .mood-cell .who')[1];
      if(w)w.innerHTML=avatar(n,c?c.avatar:'','sm')+' '+esc(n);
    }
    return;
  }
  if(el.dataset.sf!==undefined){spaceForm()[el.dataset.sf]=el.value;return}
  if(el.dataset.set!==undefined)setSetting(el.dataset.set,el.type==='checkbox'?el.checked:el.value);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.cardText!==undefined){const c=state.cards.find(x=>x.id===el.dataset.cardText);if(c){c.text=el.value;save()}return}
  if(el.id==='diary-text'){window._diaryText=el.value;return}
  if(el.id==='diary-date'){window._diaryDate=el.value;return}
  if(el.dataset.sf!==undefined){spaceForm()[el.dataset.sf]=el.value;return}
  if(el.dataset.set!==undefined){
    const v=el.type==='checkbox'?el.checked:el.value;
    setSetting(el.dataset.set,v);
    const lab=$('#val-'+el.dataset.set);
    if(lab)lab.textContent=v+(el.dataset.unit||'');
  }
  if(el.id==='chat-input'){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,96)+'px'}
});
$('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=e.target.value.trim();if(t){e.target.value='';e.target.style.height='auto';sendFromMe('text',t)}}});
$('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-root')closeModal()});
/* 长按 / 右键也能唤出「引用 / 删除」，iOS Safari 不弹系统菜单 */
(function(){
  const box=$('#chat-msgs');if(!box)return;
  let timer=null,moved=false;
  box.addEventListener('touchstart',e=>{
    const b=e.target.closest('.bubble[data-act="msg-open"]');if(!b)return;
    moved=false;clearTimeout(timer);
    timer=setTimeout(()=>{if(!moved)openMsgSheet(b.dataset.id)},480);
  },{passive:true});
  box.addEventListener('touchmove',()=>{moved=true;clearTimeout(timer)},{passive:true});
  ['touchend','touchcancel'].forEach(ev=>box.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));
  box.addEventListener('contextmenu',e=>{
    const b=e.target.closest('.bubble[data-act="msg-open"]');
    if(b){e.preventDefault();openMsgSheet(b.dataset.id)}
  });
})();
/* ================= 启动 ================= */
(async function init(){
  try{db=await openDB();const s=await idbGet();if(s)state=normalize(s)}catch(e){}
  applyLook();renderTabs();renderAll();restartAuto();restoreDiaryTimers();
  checkTaMood();setInterval(checkTaMood,60000);
  /* iOS Safari：键盘弹起时 dvh 不变，用 visualViewport 把页面压到键盘之上 */
  if(window.visualViewport){
    const vv=window.visualViewport;let raf=0;
    const sync=()=>{
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{
        const app=$('#app');if(!app)return;
        const h=vv.height,off=vv.offsetTop||0;
        if(h&&h<window.innerHeight-100){app.style.height=h+'px';app.style.maxHeight=h+'px'}
        else{app.style.height='';app.style.maxHeight=''}
        document.body.style.transform=off?'translateY('+off+'px)':'';
      });
    };
    vv.addEventListener('resize',sync);vv.addEventListener('scroll',sync);sync();
  }
  $('#plus-btn').innerHTML=icon('plus',20);
  $('[data-act="send-text"]').innerHTML=icon('send',18);
  $('.ch-back').innerHTML=icon('back',22)+'<span>会话</span>';
  $('.ch-head-r').innerHTML='<button data-act="call-start" title="通话">'+icon('phone',21)+'</button>';
  $('.tb-btn[data-act="add-char"]').innerHTML=icon('plus',20);
})();
</script>
